name: iOS simulator check

# iPhone 시뮬레이터에서 앱을 실제로 띄워 통합 테스트를 돌린다.
# 기기에 설치하기 전에 iOS에서의 동작을 확인하는 용도다.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k in sorted(d) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')][-1])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Run integration tests
        # 시뮬레이터에서 앱이 뜨지 않고 멈추는 일이 가끔 있다(테스트 출력이 한 줄도 없이 대기).
        # 그때는 시간 제한으로 끊고 시뮬레이터를 다시 켜서 한 번 더 시도한다.
        # 테스트가 실제로 실패한 경우에는 다시 시도하지 않는다.
        run: |
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            set +e
            perl -e 'alarm shift; exec @ARGV' 900 flutter test integration_test -d "$UDID"
            code=$?
            set -e
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -ne 142 ]; then
              echo "tests failed (exit $code)"
              exit "$code"
            fi
            echo "attempt $attempt timed out; restarting the simulator"
            pkill -f "flutter_tools" || true
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
          done
          echo "the app never started on the simulator"
          exit 1
